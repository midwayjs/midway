name: Deploy Site

on:
  workflow_dispatch:
  push:
    branches:
      - v4-next
    paths:
      - .github/workflows/site.yml
      - site/**
      - tutorial/**
      - CHANGELOG.md

jobs:
  build:
    name: Build Docusaurus
    strategy:
      matrix:
        node-version: [20.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache TypeDoc API pages
        uses: actions/cache@v4
        id: typedoc-cache
        with:
          path: site/.typedoc-cache
          key: typedoc-${{ hashFiles('packages/*/src/**', 'packages/*/package.json', 'site/docusaurus.config.js') }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install root dependencies
        if: steps.typedoc-cache.outputs.cache-hit != 'true'
        run: pnpm install

      - name: Build root project
        if: steps.typedoc-cache.outputs.cache-hit != 'true'
        run: pnpm run build --if-present

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install and build site
        working-directory: site
        env:
          SKIP_TYPEDOC: ${{ steps.typedoc-cache.outputs.cache-hit == 'true' && '1' || '' }}
        run: |
          npm install
          npm run build

      - name: Restore cached API docs
        if: steps.typedoc-cache.outputs.cache-hit == 'true'
        run: |
          rm -rf site/build/api site/build/en/api
          mkdir -p site/build/en
          cp -R site/.typedoc-cache/api site/build/api
          if [ -d site/.typedoc-cache/en-api ]; then
            cp -R site/.typedoc-cache/en-api site/build/en/api
          fi

      - name: Save TypeDoc API pages for later runs
        if: steps.typedoc-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf site/.typedoc-cache
          mkdir -p site/.typedoc-cache
          cp -R site/build/api site/.typedoc-cache/api
          if [ -d site/build/en/api ]; then
            cp -R site/build/en/api site/.typedoc-cache/en-api
          fi

      - name: Install and build tutorial
        working-directory: tutorial
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm run build

      - name: Merge tutorial output into site build
        run: |
          rm -rf site/build/tutorial
          mkdir -p site/build/tutorial
          cp -R tutorial/dist/. site/build/tutorial/

      - name: Zip output
        working-directory: site
        run: zip -r build/document_archive.zip docs i18n blog versioned_docs versioned_sidebars

      - name: upload files to OSS
        if: github.event_name == 'push' && github.ref == 'refs/heads/v4-next'
        uses: fangbinwei/aliyun-oss-website-action@v1
        with:
          accessKeyId: ${{ secrets.DEPLOY_SITE_ACCESS_KEY_ID }}
          accessKeySecret: ${{ secrets.DEPLOY_SITE_ACCESS_KEY_SECRET }}
          bucket: midway-next-site-hk
          endpoint: oss-cn-hongkong.aliyuncs.com
          folder: site/build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
